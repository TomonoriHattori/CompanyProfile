<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV Background</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
}
.hero-bg {
    position: relative;
    width: 100%;
    height: 100vh;
    background: linear-gradient(90deg, #ffffff 35%, #00bbe0 40%, #0a3a63 65%);
    overflow: hidden;
}
#tsparticles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
}
</style>
</head>
<body>
<div class="hero-bg">
    <div id="tsparticles"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
    fpsLimit: 60,
    background: {
        color: { value: "transparent" }
    },
    particles: {
        number: {
            value: 80,
            density: { enable: true, area: 800 }
        },
        color: {
            value: "#00bbe0"
        },
        opacity: {
            value: 0.5
        },
        size: {
            value: { min: 1, max: 3 }
        },
        links: {
            enable: true,
            distance: 150,
            color: "#00bbe0",
            opacity: 0.3,
            width: 1
        },
        move: {
            enable: true,
            speed: 1.2,
            direction: "none",
            outModes: { default: "bounce" }
        }
    },
    interactivity: {
        events: {
            onHover: { enable: true, mode: "repulse" },
            onClick: { enable: false }
        },
        modes: {
            repulse: { distance: 80, duration: 0.4 }
        }
    },
    detectRetina: true
});
</script>
</body>
</html>
